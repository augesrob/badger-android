name: Build Demo APKs (v1)

# Builds signed phone + watch APKs from the v1-demo branch and uploads them as
# workflow ARTIFACTS only. It does NOT create a GitHub release, bump versions, or
# push commits — so the live fleet, the release list, and /api/version are untouched.
on:
  push:
    branches: [ v1-demo ]
  workflow_dispatch:

concurrency:
  group: v1-demo-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-demo-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-demo-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > app/badger.keystore
          echo "Keystore size: $(stat -c%s app/badger.keystore) bytes"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APKs (phone + watch)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/badger-v1-demo.apk
          mv wear/build/outputs/apk/release/wear-release.apk \
             wear/build/outputs/apk/release/badger-wear-v1-demo.apk

      - name: Upload demo APKs (artifacts only — no release)
        uses: actions/upload-artifact@v4
        with:
          name: badger-v1-demo-apks
          path: |
            app/build/outputs/apk/release/badger-v1-demo.apk
            wear/build/outputs/apk/release/badger-wear-v1-demo.apk
          retention-days: 30
