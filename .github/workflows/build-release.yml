name: Build Release APKs

on:
  push:
    branches:
      - badger-access
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Build release APKs
      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      # Upload APKs as artifacts
      - name: Upload Phone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badger-phone-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Watch APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badger-watch-release
          path: wear/build/outputs/apk/release/*.apk
