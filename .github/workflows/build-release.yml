name: Build Release APKs

on:
  push:
    branches:
      - badger-access
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The google-services.json is already committed to the repo at app/src/main/
      # For release builds, we need to ensure it's also available in the right location
      - name: Set up google-services.json for release build
        run: |
          # File should already exist in repo, just verify it
          if [ -f app/src/main/google-services.json ]; then
            echo "✓ google-services.json found in app/src/main/"
            # Also copy to app/src/ for release variant lookup
            cp app/src/main/google-services.json app/src/google-services.json
            echo "✓ Copied to app/src/"
            ls -la app/src/google-services.json
          else
            echo "✗ google-services.json not found in app/src/main/"
            exit 1
          fi
        shell: bash

      # Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Build release APKs
      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      # Upload APKs as artifacts
      - name: Upload Phone APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: badger-phone-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Watch APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: badger-watch-release
          path: wear/build/outputs/apk/release/*.apk
