name: Build Release APKs

on:
  push:
    branches:
      - badger-access
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Decode and place keystore (using printf to avoid line breaks)
      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/badger.keystore
          file app/badger.keystore
          ls -lh app/badger.keystore

      # Build release APKs with signing
      - name: Build Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      # Upload APKs as artifacts
      - name: Upload Phone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badger-phone-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Watch APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badger-watch-release
          path: wear/build/outputs/apk/release/*.apk

      - name: Build Summary
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          echo "APK Artifacts ready for auto-updater deployment"
