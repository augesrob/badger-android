name: Build & Release APK (Badger Access)

on:
  push:
    branches: [ badger-access ]
    paths-ignore:
      - 'app/build.gradle.kts'
  workflow_dispatch:

# Cancel any in-progress build for this branch when a new push arrives.
# Only the latest commit ever gets fully built and released.
concurrency:
  group: badger-access-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: badger-access

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-access-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-access-

      - name: Decode or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using stored keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/badger.keystore
          elif [ -f "app/badger.keystore" ]; then
            echo "Using committed keystore file"
          else
            echo "Generating stable keystore (first time only — commit this file!)"
            keytool -genkeypair \
              -keystore app/badger.keystore \
              -alias badger \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass badger123 \
              -keypass badger123 \
              -dname "CN=Badger Access, OU=Badger, O=Badger Liquor Co, L=Fond du Lac, ST=WI, C=US" \
              -noprompt
          fi

      - name: Get current versionCode
        id: version
        run: |
          CURRENT=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]*')
          NEW=$((CURRENT + 1))
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "tag=access-v$NEW" >> $GITHUB_OUTPUT

      - name: Bump versionCode in build.gradle.kts
        run: |
          sed -i "s/versionCode = ${{ steps.version.outputs.current }}/versionCode = ${{ steps.version.outputs.new }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.new }}.0\"/" app/build.gradle.kts

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump access versionCode to ${{ steps.version.outputs.new }} [skip ci]"
          # Push only the version bump commit -- fetch first so we can fast-forward
          # onto whatever is on the remote, without bundling unrelated commits that
          # would trigger a second workflow run.
          git fetch origin badger-access
          git rebase origin/badger-access
          git push origin HEAD:badger-access

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/badger-access-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Badger Access ${{ steps.version.outputs.tag }}"
          body: |
            Auto-built from commit ${{ github.sha }}
            **Branch:** badger-access
            **Changes:** ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/badger-access-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
